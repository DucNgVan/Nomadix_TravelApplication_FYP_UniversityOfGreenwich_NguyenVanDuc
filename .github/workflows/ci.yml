name: Nomadix CI / Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend TDD & Coverage Gate (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend TDD Test Suites with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: nomadix_ci_access_secret_2026
          JWT_REFRESH_SECRET: nomadix_ci_refresh_secret_2026

  client-test:
    name: Mobile Client TDD & Coverage Gate (React Native / Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Client Test Suites with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
